name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Tests and the smoke test keep their settings and logs out of the build machine's own Sotto Voce folder.
env:
  SOTTO_CONFIG_DIR: ${{ github.workspace }}/.sotto-test-config

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'macos-15' && ((vars.MAC_RUNNER == 'self' && github.event_name != 'pull_request') && fromJSON('["self-hosted","macOS","ARM64","sotto-mac"]') || 'macos-15') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy onnxruntime

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: prototype/models
          key: dfn3-ll-${{ hashFiles('prototype/tools/get_models.py', 'prototype/tools/make_streaming.py', 'prototype/tools/make_batchable.py', 'prototype/tools/pb.py') }}

      - name: Download and convert the speech model
        run: python prototype/tools/get_models.py

      - name: Pick a macOS SDK the linker can use
        if: runner.os == 'macOS'
        run: |
          # Some Command Line Tools releases ship an SDK their own linker can't read yet (macOS 27's
          # lists an arm64e.x1 architecture). Use the newest installed SDK that actually links.
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/sdkprobe.c"
          for sdk in $( (ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX*.sdk 2>/dev/null; xcrun --show-sdk-path 2>/dev/null) | sort -ru); do
            if clang -isysroot "$sdk" -arch arm64 "$RUNNER_TEMP/sdkprobe.c" -o "$RUNNER_TEMP/sdkprobe" 2> "$RUNNER_TEMP/sdkprobe.log"; then
              echo "Using $sdk"; echo "SDKROOT=$sdk" >> "$GITHUB_ENV"; exit 0
            fi
            echo "The linker can't use $sdk: $(head -c 300 "$RUNNER_TEMP/sdkprobe.log")"
          done
          echo "::error title=No usable macOS SDK::None of the installed SDKs link. Update the Command Line Tools: softwareupdate --list"; exit 1

      - name: Build the native audio library
        shell: bash
        run: |
          command -v cmake || pip install cmake
          cmake -S engine/audio-io -B build/audio-io -DCMAKE_BUILD_TYPE=Release ${SDKROOT:+-DCMAKE_OSX_SYSROOT=$SDKROOT} > audio-io.log 2>&1 \
            && cmake --build build/audio-io --config Release >> audio-io.log 2>&1 \
            || { echo "::error title=Native audio library (${{ matrix.os }})::$(grep -iE 'error|warning' audio-io.log | head -c 3000 | tr '\n' ' ')"; exit 1; }
          echo "SOTTO_AUDIO_IO_DIR=$(dirname "$(find build/audio-io -type f \( -name 'sotto_audio_io.*' \) ! -name '*.lib' ! -name '*.exp' | head -1)")" >> $GITHUB_ENV

      - name: Run tests
        shell: bash
        run: |
          # Failures are also written as an annotation, so they can be read without the full log.
          rc=0; python -m unittest discover -s tests -v > test.log 2>&1 || rc=$?
          tail -40 test.log
          if [ $rc -ne 0 ]; then
            python - <<'PY'
          import re
          t = open("test.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n={60,}\n", t)
          bad = [b for b in blocks if b.startswith(("FAIL:", "ERROR:"))]
          msg = ("\n\n".join(bad) or t[-3000:])[:6000]
          print("::error title=Tests failed (${{ matrix.os }})::" + msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            exit $rc
          fi
