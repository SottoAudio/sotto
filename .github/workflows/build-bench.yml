name: build Sotto Voce

# Builds the double-click Sotto Voce app for Mac and Windows with the processing (echo canceller,
# suppressor, DeepFilterNet3 speech model) and VST3 plugin inserts bundled in. Each build is
# started against the simulated Riedel frame, given an operator profile with the VST3 SDK's
# example plugin as its insert, and checked. The latest main-branch build is published as the
# "Sotto Voce (latest build)" pre-release.

on:
  push:
    branches: [main]
    paths: ["failsafe/**", "prototype/cct/**", "prototype/tools/**", "engine/**", ".github/workflows/build-bench.yml"]
  pull_request:
    paths: ["failsafe/**", "prototype/cct/**", "prototype/tools/**", "engine/**", ".github/workflows/build-bench.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Tests and the smoke test keep their settings and logs out of the build machine's own Sotto Voce folder.
env:
  SOTTO_CONFIG_DIR: ${{ github.workspace }}/.sotto-test-config

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
            sep: ":"
          - os: windows-latest
            name: windows
            sep: ";"
    # Mac builds from main (and manual runs) go to our own Mac when the MAC_RUNNER repository
    # variable is 'self'; pull requests always use GitHub's machines.
    runs-on: ${{ matrix.name == 'mac' && ((vars.MAC_RUNNER == 'self' && github.event_name != 'pull_request') && fromJSON('["self-hosted","macOS","ARM64","sotto-mac"]') || 'macos-15') || matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy scipy onnxruntime sounddevice pyinstaller

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: prototype/models
          key: dfn3-ll-${{ hashFiles('prototype/tools/get_models.py', 'prototype/tools/make_streaming.py', 'prototype/tools/make_batchable.py', 'prototype/tools/pb.py') }}
      - name: Make sure CMake is there (our own Mac may not have it)
        run: command -v cmake || pip install cmake

      - name: Download and convert the speech model
        run: python prototype/tools/get_models.py

      - name: Pick a macOS SDK the linker can use
        if: runner.os == 'macOS'
        run: |
          # Some Command Line Tools releases ship an SDK their own linker can't read yet (macOS 27's
          # lists an arm64e.x1 architecture). Use the newest installed SDK that actually links.
          printf 'int main() { return 0; }\n' > "$RUNNER_TEMP/sdkprobe.cpp"
          for sdk in $( (ls -d /Library/Developer/CommandLineTools/SDKs/MacOSX*.sdk 2>/dev/null; xcrun --show-sdk-path 2>/dev/null) | sort -ru); do
            if clang++ -isysroot "$sdk" -arch arm64 "$RUNNER_TEMP/sdkprobe.cpp" -o "$RUNNER_TEMP/sdkprobe" 2> "$RUNNER_TEMP/sdkprobe.log"; then
              echo "Using $sdk"; echo "SDKROOT=$sdk" >> "$GITHUB_ENV"; exit 0
            fi
            echo "The linker can't use $sdk: $(head -c 300 "$RUNNER_TEMP/sdkprobe.log")"
          done
          echo "::error title=No usable macOS SDK::None of the installed SDKs link. Update the Command Line Tools: softwareupdate --list"; exit 1

      - name: Build the plugin host (library, scanner, test plugin)
        run: |
          cmake -S engine/plugin-test -B build/plugin-test -DCMAKE_BUILD_TYPE=Release -DSOTTO_BUILD_SDK_EXAMPLES=ON ${SDKROOT:+-DCMAKE_OSX_SYSROOT=$SDKROOT} > host.log 2>&1 \
            && cmake --build build/plugin-test --config Release --target sotto-plugin-test sotto_vst3host adelay --parallel >> host.log 2>&1 \
            || { echo "::error title=Plugin host (${{ matrix.name }})::$(grep -iE 'error' host.log | head -c 3000 | tr '\n' ' ')"; exit 1; }
          LIB=$(find build/plugin-test -type f \( -name 'sotto_vst3host.dylib' -o -name 'sotto_vst3host.dll' \) | head -1)
          EXE=$(find build/plugin-test -type f \( -name 'sotto-plugin-test' -o -name 'sotto-plugin-test.exe' \) | head -1)
          PD=$(dirname "$(find build/plugin-test -type d -name adelay.vst3 | head -1)")
          if [ "${{ matrix.name }}" = "windows" ]; then PLUG=$(cd "$PD" && pwd -W); else PLUG=$(cd "$PD" && pwd); fi
          echo "LIB=$LIB" >> $GITHUB_ENV
          echo "EXE=$EXE" >> $GITHUB_ENV
          echo "PLUGDIR=$PLUG" >> $GITHUB_ENV
          echo "lib $LIB, scanner $EXE, test plugin in $PLUG"

      - name: Build the native audio library
        run: |
          cmake -S engine/audio-io -B build/audio-io -DCMAKE_BUILD_TYPE=Release ${SDKROOT:+-DCMAKE_OSX_SYSROOT=$SDKROOT} > audio-io.log 2>&1 \
            && cmake --build build/audio-io --config Release >> audio-io.log 2>&1 \
            || { echo "::error title=Native audio library (${{ matrix.name }})::$(grep -iE 'error|warning' audio-io.log | head -c 3000 | tr '\n' ' ')"; exit 1; }
          AIO=$(find build/audio-io -type f \( -name 'sotto_audio_io.dylib' -o -name 'sotto_audio_io.dll' \) | head -1)
          echo "AIO=$AIO" >> $GITHUB_ENV
          echo "native audio library: $AIO"

      - name: Tests with the plugin host
        run: |
          export SOTTO_VST3HOST_DIR="$(dirname "$LIB")"
          export SOTTO_EXTRA_VST3="$PLUGDIR"
          python -m unittest tests.test_processing -v 2>&1 | tail -15

      - name: Build the app
        working-directory: failsafe
        run: |
          set -o pipefail
          MODELS=../prototype/models/DeepFilterNet3_ll_stream_batch
          # Which build this is, for the diagnostics file.
          python -c "import json, datetime, os; json.dump({'commit': os.environ['GITHUB_SHA'][:7], 'built': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'), 'run': os.environ['GITHUB_RUN_NUMBER'], 'ref': os.environ['GITHUB_REF_NAME'], 'platform': '${{ matrix.name }}'}, open('sotto_failsafe/build_info.json', 'w'))"
          ARGS=(--noconfirm --name "Sotto Voce" --paths ../prototype
                --add-data "sotto_failsafe/console.html${{ matrix.sep }}sotto_failsafe"
                --add-data "sotto_failsafe/console_bench.html${{ matrix.sep }}sotto_failsafe"
                --add-data "sotto_failsafe/setup.html${{ matrix.sep }}sotto_failsafe"
                --add-data "sotto_failsafe/build_info.json${{ matrix.sep }}sotto_failsafe"
                --add-data "$MODELS${{ matrix.sep }}models/DeepFilterNet3_ll_stream_batch"
                --add-binary "../$LIB${{ matrix.sep }}."
                --add-binary "../$EXE${{ matrix.sep }}."
                --add-binary "../$AIO${{ matrix.sep }}."
                --hidden-import sotto_failsafe.processing --hidden-import sotto_failsafe.vst3 --hidden-import sotto_failsafe.workers --hidden-import sotto_failsafe.diagnostics --hidden-import sotto_failsafe.testsrc --hidden-import sotto_failsafe.phones --hidden-import sotto_failsafe.regroup --hidden-import sotto_failsafe.coreaudio --hidden-import sotto_failsafe.nativeio --hidden-import sotto_failsafe.timing --hidden-import sotto_failsafe.faultfinder --hidden-import sotto_failsafe.ccore --hidden-import sotto_failsafe.cengine
                --hidden-import cct.aec --hidden-import cct.engine --hidden-import cct.stream_dfn --hidden-import cct.delay --hidden-import cct.denoise
                --collect-all sounddevice --collect-all _sounddevice_data --collect-all onnxruntime)
          if [ "${{ matrix.name }}" = "mac" ]; then ARGS+=(--windowed --osx-bundle-identifier audio.sotto.bench); fi
          pyinstaller "${ARGS[@]}" sotto_bench.py > build.log 2>&1 || { echo "::error title=PyInstaller (${{ matrix.name }})::$(tail -c 3000 build.log | tr '\n' ' ')"; exit 1; }
          if [ "${{ matrix.name }}" = "mac" ]; then
            PLIST="dist/Sotto Voce.app/Contents/Info.plist"
            plutil -insert NSMicrophoneUsageDescription -string "Sotto Voce listens to the talker, PGM and PROBE channels from the virtual soundcard." "$PLIST"
            plutil -replace CFBundleShortVersionString -string "0.2.0" "$PLIST"
            codesign --force --deep -s - "dist/Sotto Voce.app"
            echo 'APP=dist/Sotto Voce.app/Contents/MacOS/Sotto Voce' >> $GITHUB_ENV
          else
            echo 'APP=dist/Sotto Voce/Sotto Voce.exe' >> $GITHUB_ENV
          fi

      - name: Smoke test (simulated frame, processing, a plugin insert)
        working-directory: failsafe
        run: |
          export SOTTO_EXTRA_VST3="$PLUGDIR"
          "$APP" --simulate --track-delay on --io-buffer 160 --no-browser --port 8790 --project "$RUNNER_TEMP/project.json" > smoke.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8790/api/state > state.json && break; sleep 1; done
          fail() { echo "::error title=Smoke test (${{ matrix.name }})::$1 $(tail -c 2000 smoke.log | tr '\n' ' ')"; exit 1; }
          python -c "import json; s=json.load(open('state.json')); assert s['armed'] is False and s['solo']['ids'] == []; p=s['processing']; assert p['on'] and p['model'] and p['plugins_available'], p; print('console up, disarmed, processing on with the speech model')" || fail "state check failed:"
          python -c "import json, sys; s=json.load(open('state.json')); e, p = s['engine'], s['processing']; print('App Nap:', e.get('app_nap'), '| processing thread:', p.get('thread')); sys.exit(0 if sys.platform != 'darwin' or (e.get('app_nap') == 'App Nap off' and str(p.get('thread')).startswith('real-time (')) else 1)" || fail "macOS priority check failed:"
          python -c "import json, sys; c=json.load(open('state.json')).get('chain') or {}; print('Fault finder:', c.get('headline')); sys.exit(0 if len(c.get('links', [])) == 8 else 1)" || fail "fault finder missing from the state:"
          python -c "import json, sys; s=json.load(open('state.json')); e=s['engine']; print('Engine:', e.get('engine'), '|', e.get('engine_thread'), '|', e.get('c_engine')); sys.exit(0 if e.get('engine') == 'C' and (e.get('c_engine') or {}).get('blocks', 0) > 50 else 1)" || fail "the engine in C isn't running:"
          # every processing worker up (with its delay tracker, which starts a helper process)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8790/api/state > state.json; python -c "import json,sys; p=json.load(open('state.json'))['processing']; w=p.get('worker_detail') or []; sys.exit(0 if w and all(x['ready'] for x in w) else 1)" && break; sleep 1; done
          python -c "import json; p=json.load(open('state.json'))['processing']; w=p.get('worker_detail') or []; assert w and all(x['ready'] and not x['restarts'] for x in w), (p.get('why'), w); print('processing workers:', [(x['worker'], x['talkers'], x['pid']) for x in w])" || fail "processing workers didn't start:"
          curl -sf http://127.0.0.1:8790/ -o page.html && grep -q "<title>Sotto Voce Console</title>" page.html || fail "new console not served"
          curl -sf http://127.0.0.1:8790/bench > /dev/null || fail "bench console not served"
          curl -sf "http://127.0.0.1:8790/api/plugins" -o plugins.json || fail "plugin list failed"
          python - <<'PY' || fail "plugin insert check failed:"
          import json, time, urllib.request
          plugs = json.load(open("plugins.json"))["plugins"]
          path = [p["path"] for p in plugs if p["name"] == "ADelay"][0]
          proj = {"proc": {"mode": "full", "supp": 12, "atten": 18, "hpf": 100, "tail": 256, "trim": 0},
                  "ch": [{"name": "Talker 1", "op": "op1", "mode": "default", "used": True}],
                  "operators": [{"id": "op1", "name": "Show caller", "mode": "default", "trim": 0, "ins": {"plugin": path, "on": True}}]}
          req = urllib.request.Request("http://127.0.0.1:8790/api/project", data=json.dumps(proj).encode(), method="POST")
          r = json.load(urllib.request.urlopen(req, timeout=30)); assert r["ok"] and not r.get("errors"), r
          info = json.load(urllib.request.urlopen("http://127.0.0.1:8790/api/insert?talker=0", timeout=10))
          assert info["loaded"] and info["name"] == "ADelay", info
          time.sleep(1.0)
          st = json.load(urllib.request.urlopen("http://127.0.0.1:8790/api/state", timeout=10))
          t0 = st["processing"]["talkers"][0]
          assert t0["name"] == "Show caller" and t0["insert"]["name"].endswith("ADelay"), t0
          print("insert loaded in the built app:", t0["insert"], "| processing", st["processing"]["proc_ms"], "ms per block")
          PY
          curl -sf "http://127.0.0.1:8790/api/diagnostics?speed=1" -o diag.txt || fail "diagnostics download failed"
          for s in "What looks wrong" "Computer" "Speed test" "Busy threads" "Threads right now" "Log (last" "Audio timing in detail"; do
            grep -q "==== $s" diag.txt || fail "diagnostics file has no '$s' section"
          done
          grep -q "Soundcard open" diag.txt || fail "the log in the diagnostics file is empty"
          grep -qE "Processing in [0-9]+ worker process|Processing thread started" diag.txt || fail "the log doesn't say how processing runs"
          grep -q "Native audio: the soundcard's thread only copies audio" diag.txt || fail "the native audio engine didn't start"
          grep -q "Native soundcard side since start" diag.txt || fail "no native timing in the diagnostics file"
          python -c "import json; e=json.load(open('state.json'))['engine']; assert e.get('native') is True, e; print('native audio engine: margin', e['margin_ms'], 'ms, output', e['added_ms'], 'ms behind input')" || fail "engine not native:"
          sed -n '/==== Speed test/,/^====/p' diag.txt | head -40
          # a test source plays into input 2 at the level asked for, and the PROBE return refuses one
          python - <<'PY' || fail "test sources:"
          import json, time, urllib.request
          post = lambda p, b: json.load(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8790" + p, data=json.dumps(b).encode(), method="POST"), timeout=60))
          assert post("/api/testsrc", {"channel": 2, "kind": "tone", "level_db": -20})["ok"]
          assert not post("/api/testsrc", {"channel": 61, "kind": "tone"})["ok"]
          time.sleep(1.0)
          st = json.load(urllib.request.urlopen("http://127.0.0.1:8790/api/state", timeout=10))
          lv = st["levels_in"][1]
          assert abs(lv + 20) < 1.0, lv
          assert post("/api/testsrc", {"all_off": True})["ok"]
          chk = json.load(urllib.request.urlopen("http://127.0.0.1:8790/api/check", timeout=30))
          assert chk["ok"] and chk["checks"], chk
          cfg = json.load(urllib.request.urlopen("http://127.0.0.1:8790/api/config", timeout=10))
          assert cfg["defaults"]["pgm_in"] == "62", cfg
          assert not post("/api/config", {"pgm_in": "1"})["ok"]            # clashes with talker 1: refused
          print("device check:", [c[1] for c in chk["checks"]][:3])
          print("test tone on input 2 at", lv, "dBFS")
          PY
          curl -sf -X POST http://127.0.0.1:8790/quit
          sleep 2
          "$APP" --diagnostics --quick > cli.txt 2>&1 || fail "--diagnostics failed: $(cat cli.txt)"
          grep -q "Diagnostics written to" cli.txt || fail "--diagnostics wrote nothing: $(cat cli.txt)"
          sleep 2

      - name: Zip
        run: |
          if [ "${{ matrix.name }}" = "mac" ]; then (cd failsafe/dist && ditto -c -k --keepParent "Sotto Voce.app" ../../Sotto-Voce-mac.zip)
          else (cd failsafe/dist && 7z a ../../Sotto-Voce-windows.zip "Sotto Voce" > /dev/null); fi
      - uses: actions/upload-artifact@v4
        with:
          name: Sotto-Voce-${{ matrix.name }}
          path: Sotto-Voce-${{ matrix.name }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish "Sotto Voce (latest build)"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete bench-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create bench-latest --repo "$REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Sotto Voce (latest build)" \
            --notes "Built automatically from main ($GITHUB_SHA). Includes processing (echo canceller, suppressor, DeepFilterNet3) and VST3 plugin inserts. Not signed yet. On a Mac, the first time: right-click Sotto Voce, choose Open, then Open again (or System Settings, Privacy & Security, Open Anyway). Windows: if SmartScreen warns, choose More info, then Run anyway." \
            dl/Sotto-Voce-mac/Sotto-Voce-mac.zip dl/Sotto-Voce-windows/Sotto-Voce-windows.zip
